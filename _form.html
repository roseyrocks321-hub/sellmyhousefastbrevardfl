<!-- Contact Form -->
<section style="background:#f7fafc;padding:60px 20px;">
    <div style="max-width:600px;margin:0 auto;background:white;padding:40px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);">
        <form action="https://api.leadconnectorhq.com/widget/form/hAgGYPyaoxq8uXoosi1t" method="POST">
                    <input type="hidden" name="lead_source" value="brevard">
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Full Name <span style="color:#e53e3e;">*</span></label>
                <input type="text" name="full_name" required placeholder="John Smith" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Phone Number <span style="color:#e53e3e;">*</span></label>
                <input type="tel" name="phone" required placeholder="(321) 555-1234" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Email</label>
                <input type="email" name="email" placeholder="john@email.com" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Property Address <span style="color:#e53e3e;">*</span></label>
                <input type="text" name="address" required placeholder="123 Main St, Melbourne, FL 32901" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Your Situation <span style="color:#e53e3e;">*</span></label>
                <select name="situation" required style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
                    <option value="">Select...</option>
                    <option value="foreclosure">Facing Foreclosure</option>
                    <option value="probate">Probate/Estate</option>
                    <option value="inherited">Inherited Property</option>
                    <option value="divorce">Divorce</option>
                    <option value="repairs">Needs Repairs</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Best Time to Call</label>
                <select name="best_time" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;">
                    <option value="">Select...</option>
                    <option value="morning">Morning (8am-12pm)</option>
                    <option value="afternoon">Afternoon (12pm-5pm)</option>
                    <option value="evening">Evening (5pm-8pm)</option>
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:5px;font-weight:600;">Message</label>
                <textarea name="message" placeholder="Tell us more about your situation..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem;min-height:100px;"></textarea>
            </div>
            <button type="submit" style="width:100%;background:#1a365d;color:white;padding:15px;border:none;border-radius:5px;font-size:1.1rem;font-weight:600;cursor:pointer;">Get My Cash Offer</button>
            <p style="text-align:center;margin-top:20px;color:#666;font-size:0.9rem;">🔒 Your information is confidential and will never be shared.</p>
        </form>
    </div>
</section>
